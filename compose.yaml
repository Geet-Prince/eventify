services:
  postgres-db:
    image: postgres:17
    environment:
      POSTGRES_DB: eventify
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d eventify" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  eventify-backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/eventify
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp-relay.brevo.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-prince.raj.ds@gmail.com}
      SENDER_EMAIL: ${SENDER_EMAIL:-prince.raj.ds@gmail.com}
      APP_BASE_URL: ${APP_BASE_URL:-https://eventify-backend-bcb0.onrender.com}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://eventify.geetprince.me}
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
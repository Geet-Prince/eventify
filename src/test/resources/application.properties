# ============================================================
# Test application properties – uses H2 in-memory database
# so tests run without Docker / Postgres
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable mail autoconfiguration — tests use a MockBean instead
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT (test-only secret – 32+ chars)
jwt.secret=test-secret-key-at-least-32-characters-long
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# App config
app.auth.email-verification-required=true
app.admin.email=admin@test.local
app.mail.sender-email=noreply@test.local
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000

cors.allowed-origins=http://localhost:3000
logging.level.me.geetprince=WARN
logging.level.org.springframework.security=WARN

spring.application.name=Eventify

# ── Server Port (Dynamic for Render $PORT or local default 8080) ───────────────
server.port=${PORT:8080}

# ── Database ───────────────────────────────────────────────────────────────────
# Production (Render): Injected via Render Managed PostgreSQL (DATABASE_URL or SPRING_DATASOURCE_URL)
# DataSourceConfig automatically converts postgres:// to jdbc:postgresql:// if supplied.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventify}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning (safe defaults for Render's free tier)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Schema DDL (Default 'update' so Render DB initializes tables automatically) ─
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# ── CORS ───────────────────────────────────────────────────────────────────────
# Allows Vercel frontend, custom production domain, and local dev servers
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://eventify-frontend-beta.vercel.app,https://eventify.geetprince.me,http://localhost:3000,http://localhost:5173}

# ── JWT & Refresh Token ────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Email Verification Policy ──────────────────────────────────────────────────
app.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:true}

# ── Email & SMTP Configuration ────────────────────────────────────────────────
# Strategy 1 (Render Free Tier): Brevo HTTPS REST API (Port 443 - Never blocked)
brevo.api-key=${BREVO_API_KEY:}

# Strategy 2 (Fallback / Local): Standard SMTP (Port 587/2525)
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── App Identity ───────────────────────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:prince.raj.ds@gmail.com}
app.mail.sender-email=${SENDER_EMAIL:${ADMIN_EMAIL:prince.raj.ds@gmail.com}}
app.base-url=${APP_BASE_URL:https://eventify-backend-bcb0.onrender.com}
app.frontend-url=${APP_FRONTEND_URL:https://eventify.geetprince.me}

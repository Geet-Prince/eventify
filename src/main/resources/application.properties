spring.application.name=Eventify

# Database Configuration (Environment variable driven for production security)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventify}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema Migration & DDL (Configurable: validate for production, update for local development)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Security Logging (Disabled verbose debug logging in production)
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# CORS Configuration (Dynamic environment-specific origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT & Refresh Token Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Authentication & Email Verification Policy
app.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:true}

# Email & SMTP Configuration (Brevo / Sendinblue or any standard SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Institutional Governance & Super Admin Email (Injected via ENV, no hardcoding)
app.admin.email=${ADMIN_EMAIL:}
app.mail.sender-email=${SENDER_EMAIL:noreply@eventify.com}
app.base-url=${APP_BASE_URL:https://eventify-backend-bcb0.onrender.com}

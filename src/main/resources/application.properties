spring.application.name=Eventify

# Database Configuration (Environment variable driven for production security)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventify}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema Migration & DDL (Configurable: validate for production, update for local development)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Security Logging (Disabled verbose debug logging in production)
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# CORS Configuration (Dynamic environment-specific origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT & Refresh Token Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Authentication & Email Verification Policy
app.auth.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:true}

# ============================================================
# LOCAL DEVELOPMENT PROFILE  (active via SPRING_PROFILES_ACTIVE=local)
# Uses MailHog for email (no real SMTP needed) and local Postgres
# ============================================================

spring.application.name=Eventify

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/eventify
spring.datasource.username=${POSTGRES_USER:eventify_user}
spring.datasource.password=${POSTGRES_PASSWORD:eventify_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# DDL: update on local so schema is always in sync
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Logging ───────────────────────────────────────────────────
logging.level.me.geetprince=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.mail=DEBUG

# ── CORS (allow local front-end dev servers) ──────────────────
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4173

# ── Database pool (smaller for local dev) ─────────────────────
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:local-dev-secret-change-me-in-production-32chars}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# ── Email Verification ────────────────────────────────────────
app.auth.email-verification-required=true

# ── SMTP → MailHog (local container, no credentials needed) ───
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# ── App identity ──────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:admin@localhost}
app.mail.sender-email=${SENDER_EMAIL:noreply@localhost}
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:3000
